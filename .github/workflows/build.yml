name: Build Dev APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Dev APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable

      - name: Generate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.edutrack.dev --project-name edutrack_teacher .

      - name: Patch MainActivity for local_auth (FlutterFragmentActivity)
        run: |
          MAIN=$(find android/app/src/main/kotlin -name 'MainActivity.kt' | head -1)
          sed -i 's/import io.flutter.embedding.android.FlutterActivity/import io.flutter.embedding.android.FlutterFragmentActivity/' "$MAIN"
          sed -i 's/class MainActivity: FlutterActivity()/class MainActivity: FlutterFragmentActivity()/' "$MAIN"

      - name: Bump AGP to 8.1.1
        run: |
          # Flutter 3.27+ puts AGP version in settings.gradle pluginManagement block
          # AGP 8.1.1 is minimum required by androidx.webkit:1.14.0; needs only Gradle 8.0 (satisfied)
          sed -i 's/id "com.android.application" version "[0-9.]*" apply false/id "com.android.application" version "8.1.1" apply false/' android/settings.gradle || true
          # Fallback: older template uses build.gradle classpath
          sed -i 's/com\.android\.tools\.build:gradle:[0-9.]*/com.android.tools.build:gradle:8.1.1/' android/build.gradle || true

      - name: Set app label to Teacher (Dev)
        run: |
          sed -i 's/android:label="edutrack_teacher"/android:label="Teacher (Dev)"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Disable minify/shrink
        run: |
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle

      - name: Add INTERNET permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' \
            android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Add biometric permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>' \
            android/app/src/main/AndroidManifest.xml

      - name: Add location permissions
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>' \
            android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' \
            android/app/src/main/AndroidManifest.xml

      - name: Write local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (dart type-check)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      - name: List APK outputs
        run: find build/app/outputs -name '*.apk' | sort

      - name: Upload DEV arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: edutrack-teacher-DEV-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
