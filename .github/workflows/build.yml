name: Build & Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Flutter version check
        run: flutter --version

      # Rule 2: Generate android/ fresh — never commit it
      - name: Generate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --org com.edutrack .

      # Rule 3: shrinkResources must match minifyEnabled — both false
      - name: Disable minify/shrink
        run: |
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle

      # Rule 17: Add INTERNET permission
      - name: Add INTERNET permission
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' \
            android/app/src/main/AndroidManifest.xml

      # Rule 6: Write local.properties — NEVER set FLUTTER_ROOT as env var (Rule 9)
      - name: Write local.properties
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> android/local.properties

      - name: Get dependencies
        run: flutter pub get

      # Rule 4: Use flutter build apk, NOT gradlew directly
      - name: Build APK (release)
        run: flutter build apk --release --split-per-abi

      - name: List APK outputs
        run: find build/app/outputs -name '*.apk' | sort

      # Rule 21: Use exact APK path
      - name: Upload arm64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edutrack-teacher-arm64
          # Rule 22: arm64 for real Android devices
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      # Rule 24: Release needs write permission (set at job level above)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          name: EduTrack Teacher ${{ github.ref_name }}
          body: |
            ## EduTrack Teacher App ${{ github.ref_name }}

            ### Install on your Android phone
            1. Download `app-arm64-v8a-release.apk` (most modern phones)
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK

            ### Features
            - 📋 Mark daily attendance with present/absent/late
            - 🕐 View your weekly timetable
            - 📝 View test list, scores & AI analysis
            - 🗓️ Apply for leave + track status
            - 👤 Profile with server URL configuration
